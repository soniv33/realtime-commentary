name: Deploy demo to GitHub Pages

# Publishes docs/ (the self-contained browser demo) to GitHub Pages.
#
# One-time setup in the repo: Settings -> Pages -> "Build and deployment" ->
# Source: "GitHub Actions". Then this workflow deploys on every push that
# touches docs/, and can also be run manually from the Actions tab.

on:
  push:
    branches:
      - main
      - claude/f1-telemetry-voice-commentator-y133vy
    paths:
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # Enable Pages on first run so no manual Settings toggle is needed.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
